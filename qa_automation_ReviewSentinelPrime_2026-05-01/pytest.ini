[pytest]
# -------------------------------------------------------
# pytest.ini – Review Sentinel Prime test configuration
# -------------------------------------------------------

# Where to discover tests
testpaths = tests

# Only collect files named test_*.py
python_files = test_*.py

# Only collect functions prefixed with test_
python_functions = test_*

# Only collect classes prefixed with Test
python_classes = Test*

# Default flags:
#   -v         verbose per-test output
#   --tb=short short tracebacks on failure
#   -r a       show reasons for ALL non-passing tests
addopts =
    -v
    --tb=short
    -r a
    --html=results/reports/report.html
    --self-contained-html
    --junit-xml=results/reports/junit.xml

# Markers used in the suite
markers =
    routes:         Page-route smoke tests
    api:            REST endpoint tests
    unit:           Pure unit tests (no Flask server)
    helpers:        Helper function unit tests
    edge:           Edge-case / boundary tests
    negative:       Negative / error-path tests
    security:       Security guard tests
    mocking:        Tests that mock external HTTP calls
    crud:           CRUD lifecycle tests
    export:         ZIP export tests
    keys:           API key management tests
    saved-searches: Saved search CRUD tests
